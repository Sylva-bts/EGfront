<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Set this value to the public backend URL when the frontend and backend
       are hosted separately. app-api.js reads it before making requests. -->
  <meta name="ghostr-api-base-url" content="https://egback-1.onrender.com">
  <title>Verification email | Escape the Ghost</title>
  <link rel="stylesheet" href="GhostR.css">
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;font-family:"Trebuchet MS","Segoe UI",sans-serif;color:#edf5ff;background:radial-gradient(circle at top,rgba(180,124,255,.2),transparent 35%),linear-gradient(145deg,#090512,#24103f)}
    main{width:min(480px,100%);padding:36px;border:1px solid rgba(255,255,255,.14);border-radius:26px;background:rgba(7,14,26,.82);box-shadow:0 24px 70px rgba(0,0,0,.42)}
    h1{margin:0 0 10px}p{color:#b6cae6;line-height:1.6}label{display:block;margin:22px 0 8px;font-weight:700}input,button{width:100%;min-height:54px;border-radius:15px;font:inherit}input{box-sizing:border-box;padding:12px 15px;border:1px solid rgba(255,255,255,.16);background:#0d1422;color:#fff;text-align:center;font-size:1.5rem;letter-spacing:.35em}button{margin-top:16px;border:0;font-weight:700;cursor:pointer;background:linear-gradient(135deg,#d7b0ff,#f2e1ff);color:#08111d}button.secondary{background:transparent;border:1px solid rgba(255,255,255,.18);color:#d7b0ff}button:disabled{opacity:.65;cursor:wait}#message{min-height:24px;margin-top:18px;font-weight:700}#message[data-state="error"]{color:#ff9090}#message[data-state="success"]{color:#88f5ca}
  </style>
</head>
<body>
  <main>
    <h1>Verifiez votre email</h1>
    <p>Nous avons envoye un code confidentiel a 5 chiffres a <strong id="emailLabel"></strong>. Il expire dans 10 minutes.</p>
    <form id="verifyForm">
      <label for="code">Code de verification</label>
      <input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{5}" maxlength="5" required autofocus>
      <button type="submit">Activer mon compte</button>
    </form>
    <button class="secondary" id="resend" type="button">Renvoyer un code</button>
    <div id="message" aria-live="polite"></div>
  </main>
  <script src="app-api.js?v=20261122-email-verification"></script>
  <script>
    const email = new URL(window.location.href).searchParams.get('email') || '';
    const emailLabel = document.getElementById('emailLabel');
    const message = document.getElementById('message');
    const codeInput = document.getElementById('code');
    emailLabel.textContent = email || 'votre adresse email';
    function show(text, state='') { message.textContent = text; message.dataset.state = state; }
    codeInput.addEventListener('input', () => { codeInput.value = codeInput.value.replace(/\D/g, '').slice(0, 5); });
    document.getElementById('verifyForm').addEventListener('submit', async (event) => {
      event.preventDefault();
      if (!email) return show('Adresse email manquante. Retournez a l’inscription.', 'error');
      const button = event.currentTarget.querySelector('button'); button.disabled = true; show('Verification du code...');
      try {
        const data = await window.AppApi.fetchJson('/api/auth/verify-email', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email,code:codeInput.value})});
        window.AppApi.setToken(data.token, data.user); show(data.message, 'success');
        setTimeout(() => window.location.assign('GhostR.html'), 700);
      } catch (error) { show(error.message, 'error'); } finally { button.disabled = false; }
    });
    document.getElementById('resend').addEventListener('click', async (event) => {
      if (!email) return show('Adresse email manquante. Retournez a l’inscription.', 'error');
      event.currentTarget.disabled = true; show('Envoi du nouveau code...');
      try { const data = await window.AppApi.fetchJson('/api/auth/resend-email-verification', {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email})}); show(data.message, 'success'); }
      catch (error) { show(error.message, 'error'); } finally { event.currentTarget.disabled = false; }
    });
  </script>
</body>
</html>
